name: Fast Anime Stream Ingestion Pipeline

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Anime AniList or MAL ID (e.g. 21 for One Piece)'
        required: true
        default: '21'
      type:
        description: 'ID Provider (ani or mal)'
        required: true
        default: 'ani'
        type: choice
        options:
          - ani
          - mal
      start_ep:
        description: 'Start Episode Number (e.g. 1)'
        required: true
        default: '1'
      end_ep:
        description: 'End Episode Number (e.g. 10 or 25)'
        required: true
        default: '10'
      track:
        description: 'Audio Track (sub or dub)'
        required: true
        default: 'sub'
        type: choice
        options:
          - sub
          - dub
      megaplay_api:
        description: 'MegaPlay Scraper API URL'
        required: false
        default: 'http://54.39.22.90:4004'

jobs:
  ingest_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg & Media Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Execute Parallel Ingestion & Telegram Upload
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '38731827' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'f52eaaae40fbc572fcf046c82f620054' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8902447483:AAH-zDT_BUwV3WmuW9dvkdAVKWlHP4fJowI' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1004305106563' }}
          MEGAPLAY_API: ${{ inputs.megaplay_api }}
        run: |
          echo "=========================================================="
          echo "🚀 STARTING BULK INGESTION RUNNER"
          echo "Target Anime: ${{ inputs.type }}:${{ inputs.id }} EPs:${{ inputs.start_ep }} to ${{ inputs.end_ep }} [${{ inputs.track }}]"
          echo "=========================================================="
          node ingest.js --id ${{ inputs.id }} --type ${{ inputs.type }} --start-ep ${{ inputs.start_ep }} --end-ep ${{ inputs.end_ep }} --track ${{ inputs.track }}

      - name: Auto-Commit Catalog Mapping to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(catalog): auto-sync episodes ${{ inputs.start_ep }}-${{ inputs.end_ep }} for anime ${{ inputs.id }}" || echo "No changes to commit"
          git push origin main || echo "Push skipped or already up to date"

      - name: Pipeline Completed Summary
        run: |
          echo "🎉 Episode batch successfully ingested, merged, and uploaded to Telegram Storage Channel!"
          echo "Catalog automatically updated in repository."
