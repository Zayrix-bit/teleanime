name: 🚀 DesiDubAnime & Stream Ingestion Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ingestion Mode'
        required: true
        default: 'desidub_anime'
        type: choice
        options:
          - desidub_anime
          - direct_url
      anime:
        description: 'Anime Name or Slug (for desidub_anime mode, e.g. slime or solo leveling)'
        required: false
        default: 'slime'
      episode:
        description: 'Episode Number (e.g. 1, 20)'
        required: false
        default: '1'
      server:
        description: 'Preferred Player / Server'
        required: false
        default: 'vidmoly'
        type: choice
        options:
          - vidmoly
          - mirror
          - abyss
          - p2p
      direct_url:
        description: 'Direct Watch Link or Stream URL (for direct_url mode)'
        required: false
        default: ''
      caption:
        description: 'Custom Telegram Caption (optional)'
        required: false
        default: ''

jobs:
  scrape_convert_upload:
    name: Scrape, Convert & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🎬 Install FFmpeg & Media Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 📥 Install Dependencies
        run: npm ci || npm install

      - name: 🚀 Execute Scraper Pipeline & Upload to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '38731827' }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || 'f52eaaae40fbc572fcf046c82f620054' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8902447483:AAH-zDT_BUwV3WmuW9dvkdAVKWlHP4fJowI' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1004305106563' }}
        run: |
          echo "=========================================================="
          echo "🚀 STARTING DESIDUBANIME INGESTION PIPELINE"
          echo "Mode: ${{ inputs.mode }}"
          echo "=========================================================="

          if [ "${{ inputs.mode }}" = "desidub_anime" ]; then
            echo "Target Anime: ${{ inputs.anime }} | Episode: ${{ inputs.episode }}"
            ARGS="--anime \"${{ inputs.anime }}\" --ep \"${{ inputs.episode }}\""
          else
            echo "Direct URL: ${{ inputs.direct_url }}"
            ARGS="--url \"${{ inputs.direct_url }}\""
          fi

          if [ -n "${{ inputs.server }}" ]; then
            ARGS="$ARGS --server \"${{ inputs.server }}\""
          fi

          if [ -n "${{ inputs.caption }}" ]; then
            ARGS="$ARGS --caption \"${{ inputs.caption }}\""
          fi

          eval node index.js $ARGS

      - name: 🎉 Completion Summary
        if: success()
        run: |
          echo "🎉 Stream successfully scraped, converted to MP4 with faststart, and uploaded to Telegram!"
